<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <meta name="viewport" content="width=device-width, initial-scale1.0"/>
</head>
<body>

<h1>Tic Tac Toe</h1>

<h2 th:text="${message}"></h2>

<div class="board">

    <div th:each="row,rowStat : ${board}">

        <div th:each="cell,colStat : ${row}">

            <form th:action="@{/move}" method="post">
                <input type="hidden" name="row" th:value="${rowStat.index}">
                <input type="hidden" name="col" th:value="${colStat.index}">
                <button type="submit" class="cell"
                    th:text="${cell == null ? '' : cell}">
                </button>
            </form>

        </div>

    </div>

</div>

<div class="scoreboard">
    <h3>🏆 You: <span th:text="${playerWins}"></span>
    🤖 System: <span th:text="${systemWins}"></span>
    🤝 Draws: <span th:text="${draws}"></span></h3>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<script th:if="${message != null and #strings.contains(message, 'You Win')}">
    confetti({
        particleCount: 200,
        spread: 120,
        origin: { y: 0.6 }
    });
</script>
<script th:if="${message != null and #strings.contains(message,'Win')}">
    setTimeout(function() {

        if(confirm("Game Over! Start a new game?")) {
            window.location.href = "/";
        }

    }, 500);
</script>
<div th:if="${message != null and (#strings.contains(message,'Win') or #strings.contains(message,'Draw'))}">
    <form th:action="@{/new-game}" method="post">
        <button type="submit">🎮 Play Again</button>
    </form>
</div>

<footer style="margin-bottom:30px; text-align:center;">
    <hr>
    <p>Designed and developed by <b>ZEBA TAHSEEN </b> using Java and SpringBoot.</p>
</footer>

<script>
window.addEventListener("beforeunload", function () {
    navigator.sendBeacon('/reset-board');
});
</script>

</body>
</html>
